}

  --accent:#ff7a3d; --accent-ink:#1b0c03; --row:#62b9d4; --ok:#5ec98f; --warn:#e2b257; --bad:#f2a19b;

:root[data-theme="dark"]{

*{box-sizing:border-box}
html,body{margin:0}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 52px)}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:30px;text-transform:uppercase}
h2{font-size:24px;text-transform:uppercase}
h3{font-size:19px}
p{margin:0}
a{color:var(--row)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
input,select{font-size:16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;justify-content:space-between;padding-top:18px;padding-bottom:12px}
.top .wk{font-family:var(--display);font-size:19px;color:var(--muted)}
.top .wk b{color:var(--accent);font-weight:600}
nav.tabs{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs .wrap::-webkit-scrollbar{display:none}
nav.tabs a{font-family:var(--display);font-size:18px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;text-decoration:none;color:var(--muted);padding:11px 12px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a.on{color:var(--ink);border-bottom-color:var(--accent)}
main{display:flex;flex-direction:column;gap:18px;padding-top:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted)} .small{font-size:14px}
.rowf{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sp{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.sm{padding:5px 10px;font-size:14px}
.btn,.chk,.tog{min-height:44px}
.btn.sm{min-height:38px;min-width:38px}
.pill{display:inline-block;font-family:var(--display);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.04em;border-radius:99px;padding:2px 10px;border:1px solid currentColor}
.pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)}
.refs{display:flex;flex-direction:column;gap:14px}
.ref{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.bands{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.bd{border-radius:8px;padding:6px 8px;font-size:14px;font-weight:600;border:1px solid var(--line);border-top:4px solid;font-variant-numeric:tabular-nums}
.bd i{display:block;font-style:normal;font-weight:400;font-size:12px;color:var(--muted)}
.bd.ok{border-top-color:var(--ok)} .bd.warn{border-top-color:var(--warn)} .bd.bad{border-top-color:var(--bad)}
.pill.F{color:var(--accent)} .pill.R{color:var(--row)} .pill.X{color:var(--muted)} .pill.ok{color:var(--ok)}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;border-top-width:4px}
.day.F{border-top-color:var(--accent)} .day.R{border-top-color:var(--row)} .day.X{border-top-color:var(--line)}
.day .dn{font-size:13px;color:var(--muted)} .day .dt{font-family:var(--display);font-weight:600;font-size:17px;line-height:1.1;text-align:center}
.day .st{font-size:12px;color:var(--muted)} .day.done .st{color:var(--ok);font-weight:600}
.day.sel{outline:2px solid var(--ink);outline-offset:1px} .day.today .dn{color:var(--ink);font-weight:600}
/* ejercicio */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ex.complete{border-left:4px solid var(--ok)}
.ex-h{width:100%;display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;text-align:left;background:none;border:0;padding:12px 14px}
.ex-h .num{font-family:var(--display);font-weight:700;font-size:24px;color:var(--muted);font-variant-numeric:tabular-nums}
.ex-h .ti{display:flex;flex-direction:column;min-width:0}
.ex-h .ti b{font-family:var(--display);font-size:20px;font-weight:600;line-height:1.15}
.ex-h .ti small{color:var(--muted);font-size:13px}
.ex-h .rx{text-align:right;font-family:var(--display);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.ex-h .rx small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted)}
.ex-b{border-top:1px solid var(--line);padding:14px;display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:16px}
@media (max-width:620px){.ex-b{grid-template-columns:1fr}}
.figbox{background:var(--soft);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:6px}
svg.anim{display:block;width:100%;height:auto}
.fg,.fg2{fill:none;stroke:var(--fig);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.fg2{stroke:var(--fig2)} .hd{fill:var(--fig)}
.ln{fill:none;stroke-linecap:round} .sk{stroke:var(--skin)} .sk2{stroke:var(--skin2)} .sh{stroke:var(--fig)} .sh2{stroke:var(--fig2)} .st{stroke:var(--shorts)} .st2{stroke:var(--shorts2)} .so{stroke:var(--fig)} .so2{stroke:var(--fig2)} .halo{stroke:var(--soft)}
.tor{fill:var(--fig);stroke:var(--fig);stroke-width:5;stroke-linejoin:round} .fsk{fill:var(--skin)} .fsk2{fill:var(--skin2)} .fst{fill:var(--shorts)} .hair{fill:var(--hair)} .gr{stroke:var(--fig2);stroke-width:1.5}
.prop{fill:var(--prop)} .propl{stroke:var(--prop);stroke-width:6;stroke-linecap:round}
.db{fill:var(--accent)} .band{stroke:var(--row);stroke-width:2.2} .whl{fill:none;stroke:var(--accent);stroke-width:3}
.nt{font:8px var(--body);fill:var(--muted)}
.vid{font-size:14px;text-align:center;padding:4px}
.cues{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.info{display:flex;flex-direction:column;gap:10px;min-width:0}
.err{font-size:14px;border-left:3px solid var(--warn);padding-left:10px}
.err b{color:var(--warn)}
.sets{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:64px 1fr 1fr auto;gap:8px;align-items:center}
.set.nokg{grid-template-columns:64px 1fr auto}
.set>span{font-size:14px;color:var(--muted)}
.in{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 8px;min-width:0}
.in input{border:0;background:none;width:100%;min-width:0;padding:8px 0;font-variant-numeric:tabular-nums}
.in input:focus{outline:none} .in:focus-within{border-color:var(--accent)}
.in i{font-style:normal;font-size:13px;color:var(--muted)}
.chk{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:600;white-space:nowrap}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
/* tablas */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--display);font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
tr.cur td{background:var(--soft);font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.tile .v{font-family:var(--display);font-size:34px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.tile .l{font-size:13px;color:var(--muted)} .tile .d{font-size:13px}
.up{color:var(--ok)} .down{color:var(--warn)}
.sched{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px}
.sched label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
select,.fi{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end}
.form label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
.tog{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface)}
.tog input{width:18px;height:18px;accent-color:var(--accent)}
.note{border-left:3px solid var(--row);padding-left:12px}
.warnbox{border-left:3px solid var(--warn);padding-left:12px}
ol.obs{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;max-width:68ch}
.chart text{font:10px var(--body);fill:var(--muted)}
.chart.big{display:block;width:100%;min-width:480px;height:auto} .chart.big text{font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.lg{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:14px;min-height:38px}
.lg b{font-variant-numeric:tabular-nums} .lg i{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
.lg.off{opacity:.45} .lg.off span{text-decoration:line-through}
/* temporizador */
#timer{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--bg);z-index:10;display:none}
#timer.on{display:block}
#timer .wrap{display:flex;gap:12px;align-items:center;padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
#timer .tm{font-family:var(--display);font-size:38px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;min-width:92px}
#timer .lb{flex:1;font-size:14px;min-width:0}
#timer .bar{height:4px;background:var(--accent);width:0}
#timer button{border:1px solid currentColor;background:none;color:inherit;border-radius:8px;padding:7px 12px;font-weight:600}
#timer.end{background:var(--ok)}

  h1{font-size:24px} .top .wrap{padding-top:12px;padding-bottom:8px}

}
footer{margin-top:24px;font-size:13px;color:var(--muted)}
</style>

for(const key in ANIMS){const d=ANIMS[key];let prev={};d.k=d.k.map(p=>{const q=Object.assign({},prev,p);
  if(q.hd&&q.hd.length===1)q.hd=[q.hd[0],q.hd[0]];if(q.ft&&q.ft.length===1)q.ft=[q.ft[0],q.ft[0]];prev=q;return q;});}

function ik(S,T,l1,l2,s){const dx=T[0]-S[0],dy=T[1]-S[1],d=Math.hypot(dx,dy),mx=l1+l2-.01,mn=Math.abs(l1-l2)+.01,
  dc=Math.min(mx,Math.max(mn,d)),a=Math.atan2(dy,dx),c=(l1*l1+dc*dc-l2*l2)/(2*l1*dc),ph=Math.acos(Math.max(-1,Math.min(1,c)));
  return [[S[0]+l1*Math.cos(a+s*ph),S[1]+l1*Math.sin(a+s*ph)],(d>mx||d<mn)?[S[0]+dc*Math.cos(a),S[1]+dc*Math.sin(a)]:T];}
const mix=(a,b,f)=>a+(b-a)*f, mixP=(a,b,f)=>[mix(a[0],b[0],f),mix(a[1],b[1],f)];
const n1=v=>Math.round(v*10)/10, pt=p=>n1(p[0])+','+n1(p[1]);

function figure(key,ov,u){
  const d=Object.assign({},ANIMS[key],ov||{}),k=d.k,n=k.length-1;
  const x=Math.max(0,Math.min(1,u))*n,i=Math.min(n-1,Math.floor(x)),f=x-i,a=k[i],b=k[i+1];
  const H=mixP(a.h,b.h,f),t=mix(a.t,b.t,f)*Math.PI/180,tl=d.tl===undefined?36:d.tl;
  const dir=[Math.cos(t),Math.sin(t)],N=[H[0]+tl*dir[0],H[1]+tl*dir[1]],HD=[N[0]+13*dir[0],N[1]+13*dir[1]];
  const fr=!!d.front,S=fr?[[N[0]-12,N[1]],[N[0]+12,N[1]]]:[N,N],HP=fr?[[H[0]-7,H[1]],[H[0]+7,H[1]]]:[H,H];
  const eb=d.eb||(fr?[1,-1]:[1,1]),kb=d.kb||(fr?[1,-1]:[-1,-1]);
  let o='';
  if(!d.noGround)o+=`<line class="gr" x1="6" y1="${GY}" x2="194" y2="${GY}"/>`;
  for(const p of d.props||[]){
    if(p[0]==='box')o+=`<rect class="prop" x="${p[1]}" y="${p[2]}" width="${p[3]}" height="${p[4]}" rx="2"/>`;
    if(p[0]==='bench')o+=`<rect class="prop" x="${p[1]}" y="${p[2]}" width="${p[3]}" height="6" rx="2"/><rect class="prop" x="${p[1]+5}" y="${p[2]+6}" width="4" height="${GY-p[2]-6}"/><rect class="prop" x="${p[1]+p[3]-9}" y="${p[2]+6}" width="4" height="${GY-p[2]-6}"/>`;
    if(p[0]==='incline')o+=`<line class="propl" x1="${p[1]}" y1="${p[2]}" x2="${p[3]}" y2="${p[4]}"/>`;
  }
  const arms=[0,1].map(j=>{const r=ik(S[j],mixP(a.hd[j],b.hd[j],f),19,19,eb[j]);return [S[j],r[0],r[1]];});
  const legs=d.nolegs?[]:[0,1].map(j=>{const r=ik(HP[j],mixP(a.ft[j],b.ft[j],f),27,27,kb[j]);
    const toe=(d.toe&&j===0)?d.toe:fr?[r[1][0]+(j?6:-6),r[1][1]+2]:[r[1][0]+(d.foot?d.foot[0]:9),r[1][1]+(d.foot?d.foot[1]:2)];
    return [HP[j],r[0],r[1],toe];});
  const hands=arms.map(m=>m[2]);
  const pl=(m,c)=>`<polyline class="${c}" points="${m.map(pt).join(' ')}"/>`;
  const band=(p,q)=>`<line class="band" x1="${n1(p[0])}" y1="${n1(p[1])}" x2="${n1(q[0])}" y2="${n1(q[1])}"/>`;
  if(d.band==='foot'&&legs.length)o+=band(legs[0][2],hands[0]);
  if(d.band==='neck'&&legs.length)o+=band(legs[0][2],N);
  if(d.band==='feet'&&legs.length)o+=band(legs[0][2],hands[0])+band(legs[1][2],hands[1]);
  // Cuerpo con volumen: piel, polera, short y zapatillas; las extremidades del lado lejano van más apagadas
  const L=(p,q,w,c)=>`<line class="ln ${c}" x1="${n1(p[0])}" y1="${n1(p[1])}" x2="${n1(q[0])}" y2="${n1(q[1])}" stroke-width="${w}"/>`;
  const C=(p,r,c)=>`<circle class="${c}" cx="${n1(p[0])}" cy="${n1(p[1])}" r="${r}"/>`;
  const arm=(m,far,halo)=>(halo?L(m[0],m[1],12,'halo')+L(m[1],m[2],10.5,'halo'):'')+L(m[0],m[1],7.5,far?'sk2':'sk')+L(m[1],m[2],6,far?'sk2':'sk')+L(m[0],mixP(m[0],m[1],.45),8.5,far?'sh2':'sh')+C(m[2],3.6,far?'fsk2':'fsk');
  const leg=(m,far)=>L(m[0],m[1],10.5,far?'sk2':'sk')+L(m[1],m[2],8,far?'sk2':'sk')+L(m[0],mixP(m[0],m[1],.6),12,far?'st2':'st')+L(m[2],m[3],6,far?'so2':'so');
  const P=[-dir[1],dir[0]],fs=d.face||1;
  if(legs[1])o+=leg(legs[1],!fr);
  if(!fr)o+=arm(arms[1],true,false);
  o+=L(N,HD,5.5,'sk');
  const tp=fr?[S[0],S[1],HP[1],HP[0]]:[[H[0]-P[0]*4.5,H[1]-P[1]*4.5],[N[0]-P[0]*5.5,N[1]-P[1]*5.5],[N[0]+P[0]*5.5,N[1]+P[1]*5.5],[H[0]+P[0]*4.5,H[1]+P[1]*4.5]];
  o+=`<polygon class="tor" points="${tp.map(pt).join(' ')}"/>`;
  if(!d.nolegs)o+=fr?L(HP[0],HP[1],11,'st'):C(H,6.5,'fst');
  if(legs[0])o+=leg(legs[0],false);
  o+=C(HD,8,'hair')+C(fr?[HD[0]-dir[0]*1.6,HD[1]-dir[1]*1.6]:[HD[0]+P[0]*fs*2-dir[0]*1.2,HD[1]+P[1]*fs*2-dir[1]*1.2],7,'fsk');
  if(fr)o+=arm(arms[1],false,true);
  o+=arm(arms[0],false,true);
  if(d.band==='hands')o+=band(hands[0],hands[1]);
  const dbs=h=>`<circle class="db" cx="${n1(h[0])}" cy="${n1(h[1])}" r="5"/>`;
  const dbf=h=>`<rect class="db" x="${n1(h[0]-8)}" y="${n1(h[1]-3.5)}" width="16" height="7" rx="2"/>`;
  if(d.db==='both')o+=dbs(hands[0]);
  if(d.db==='one')o+=dbs(hands[0]);
  if(d.db==='front')o+=dbf(hands[0])+dbf(hands[1]);
  if(d.db==='goblet'){const m=mixP(hands[0],hands[1],.5);o+=`<rect class="db" x="${n1(m[0]-4.5)}" y="${n1(m[1]-7)}" width="9" height="14" rx="2"/>`;}
  if(d.db==='pack')o+=`<rect class="db" x="${n1(hands[0][0]-8)}" y="${n1(hands[0][1]-3)}" width="16" height="19" rx="4"/>`;
  if(d.wheel)o+=`<circle class="whl" cx="${n1(hands[0][0])}" cy="${n1(hands[0][1])}" r="8"/>`;
  if(d.note)o+=`<text class="nt" x="100" y="146" text-anchor="middle">${d.note}</text>`;
  return o;
}

/* ===== Utilidades ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d);};
const wd=s=>(parse(s).getDay()+6)%7;
const monday=s=>addDays(s,-wd(s));
const fdate=s=>{const d=parse(s);return d.getDate()+' '+MS[d.getMonth()];};
const num=v=>String(v).replace('.',',');
const TODAY=iso(new Date());

/* ===== Estado y guardado ===== */
const KEY='plan-fuerza-remo-v1';
function defaults(){return {v:1,ts:0,equip:{db:false,bench:false,band:true},sched:['A','R','B','X','C','R','X'],start:monday(TODAY),pick:{},log:{},body:[]};}
function merge(r){const d=defaults();if(!r||typeof r!=='object')return d;const s=Object.assign(d,r);s.equip=Object.assign({db:false,bench:false,band:true},r.equip||{});
  if(!Array.isArray(s.sched)||s.sched.length!==7)s.sched=defaults().sched;if(!Array.isArray(s.body))s.body=[];if(!s.log||typeof s.log!=='object')s.log={};if(!s.pick)s.pick={};return s;}
let state;try{state=merge(JSON.parse(localStorage.getItem(KEY)));}catch(e){state=defaults();}
let db=null,dirty=false,saving=false,saveT=null;
function setSync(t){const el=$('#sync');if(el)el.textContent=t;}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function persist(){state.ts=Date.now();saveLocal();dirty=true;clearTimeout(saveT);saveT=setTimeout(flush,1200);}
async function flush(){if(!db||saving||!dirty)return;saving=true;dirty=false;
  try{await db.doc('tracker/state').set(JSON.parse(JSON.stringify(state)));setSync('Cambios guardados en tu cuenta.');}
  catch(e){dirty=true;setSync('No se pudo guardar en tu cuenta. Los cambios quedan en este navegador y se reintentará con el próximo cambio.');}
  saving=false;if(dirty&&db){clearTimeout(saveT);saveT=setTimeout(flush,8000);dirty=dirty;}}
async function initDb(){
  try{if(!window.claude||!window.claude.use){setSync('Tus registros se guardan en este dispositivo.');return;}
    db=await window.claude.use('db');if(!db){setSync('Guardando solo en este navegador.');return;}
    const snap=await Promise.race([db.doc('tracker/state').get(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),10000))]);
    if(snap.exists){const r=snap.data();if((r.ts||0)>=(state.ts||0)){state=merge(JSON.parse(JSON.stringify(r)));saveLocal();render();}else{dirty=true;flush();}}
    else if(state.ts){dirty=true;flush();}
    setSync('Tus registros se guardan en tu cuenta.');
  }catch(e){setSync('No se pudo leer lo guardado en tu cuenta. Por ahora se guarda en este navegador.');}
}

const STANDALONE=!window.claude;
/* ===== Lógica del plan ===== */
let sel=TODAY,rtab='A';const open=new Set();
const split=()=>state.mode==='split',rut=()=>split()?RUT_S:RUT,pk=(r,i)=>(split()?'s':'')+r+i,tname=k=>(split()&&TYPES_S[k])||TYPES[k];
const weekOf=d=>Math.round((parse(monday(d))-parse(state.start))/6048e5)+1;
const blockOf=w=>Math.floor((Math.max(w,1)-1)/BW)+1,wbOf=w=>((Math.max(w,1)-1)%BW)+1;
const phaseOf=w=>{const k=wbOf(w);return k<=3?1:k<=7?2:3;};
function presc(w,kind,ex){const p=phaseOf(w),q=p===3?2:p;let s,r,t;
  if(kind==='main')[s,r,t]=(split()?[[4,'8-12',90],[4,'6-10',120]]:[[3,'12-15',60],[4,'8-12',90]])[q-1];
  else if(kind==='calf')[s,r,t]=[3,'15-20',45];
  else if(kind==='core'){s=3;r=ex.r[q-1];t=45;}
  else [s,r,t]=(split()?[[3,'10-15',60],[3,'8-12',75]]:[[3,'12-15',60],[3,'10-15',60]])[q-1];
  if(p===3||w<=1)s=2;return {sets:s,reps:r,rest:t};}
const typeOf=d=>(state.log[d]&&state.log[d].type)||state.sched[wd(d)];
const noBand=o=>[...new Set(o.map(x=>ALT[x]||x))];
function tiers(o){const e=state.equip;return [e.band===false?noBand(o[0]):o[0],e.db?o[1]:null,e.db&&e.bench?o[2]:null].filter(Boolean);}
// Las variantes sin banda siempre se ofrecen en "Cambiar variante", aunque haya bandas
function avail(o){return [...new Set(tiers(o).flat().concat(noBand(o[0])))];}
const harder=()=>state.equip.band===false?'una mochila con más peso':'una banda más dura o una mochila con peso';
function chosen(r,i,b){const o=rut()[r].s[i][2],t=tiers(o),top=t[t.length-1],p=state.pick[pk(r,i)];
  if(p&&p.b===b&&avail(o).includes(p.id))return p.id;return top[(b-1)%top.length];}
function entry(d,create){if(!state.log[d]&&create)state.log[d]={type:typeOf(d),ex:{}};const e=state.log[d];if(e&&!e.ex)e.ex={};return e;}
function histOf(id,before,n){const out=[];for(const d of Object.keys(state.log).filter(d=>d<before).sort().reverse()){const x=state.log[d].ex&&state.log[d].ex[id];if(x&&x.some(q=>q&&q.ok)){out.push({d,s:x.filter(q=>q&&q.ok)});if(out.length>=n)break;}}return out;}
function lastOf(id,before){return histOf(id,before,1)[0]||null;}
// Objetivo del día: doble progresión (primero repeticiones, después peso)
function target(id,ex,kind,rx,w,d){const h=histOf(id,d,3),m=rx.reps.split('-').map(Number),mn=m[0],mx=m[m.length-1],un=ex.u?' segundos':' repeticiones';
  if(!h.length)return {t:ex.w?`Primera vez: elige un peso con el que llegues a ${mn} repeticiones con esfuerzo, sin fallar.`:`Primera vez: busca llegar a ${mn}${un} por serie con buena técnica.`};
  const reps=h[0].s.map(x=>+x.r||0),kg=Math.max(0,...h[0].s.map(x=>+String(x.kg||0).replace(',','.')||0));
  const score=e=>e.s.reduce((a,x)=>a+(+String(x.kg||0).replace(',','.')||0)*1000+(+x.r||0),0)/e.s.length;
  const stall=h.length===3&&score(h[0])<=score(h[2])?' Llevas 3 sesiones sin avanzar en este ejercicio: prueba otra variante con el botón de abajo y revisa descanso y alimentación.':'';
  if(phaseOf(w)===3)return {t:`Descarga: repite ${ex.w&&kg?num(kg)+' kg':'lo de la última vez'} con 2 series cómodas.`,kg:kg||''};
  if(ex.w&&kg){if(reps.every(r=>r>=mx)){const nk=kg+(kind==='main'?2:1);return {t:`Completaste el rango con ${num(kg)} kg. Hoy sube a ${num(nk)} kg y apunta a ${mn} repeticiones.`,kg:nk};}
    if(reps.some(r=>r<mn-2))return {t:`${num(kg)} kg quedó pesado para este rango. Baja 1 o 2 kg y busca ${mn} repeticiones limpias.`+stall,kg:Math.max(1,kg-(kind==='main'?2:1))};
    return {t:`Repite ${num(kg)} kg y suma al menos 1 repetición a alguna serie (rango ${rx.reps}).`+stall,kg};}
  if(reps.every(r=>r>=mx))return {t:ex.u?`Ya dominas ${mx} segundos: súmale 10 segundos o levanta un pie.`:`Ya dominas el rango. Hazlo más difícil: bajada en 3 segundos, pausa, ${harder()}.`+stall};
  return {t:`Suma al menos 1${ex.u?'0 segundos':' repetición'} respecto a la última vez (rango ${rx.reps}${ex.u?' s':''}).`+stall};}
/* ===== Vistas ===== */
function weekStrip(){const m=monday(sel);let h='<div class="week">';
  for(let i=0;i<7;i++){const d=addDays(m,i),t=typeOf(d),c=t==='R'?'R':t==='X'?'X':'F',done=state.log[d]&&state.log[d].done;
    h+=`<button type="button" class="day ${c}${d===sel?' sel':''}${d===TODAY?' today':''}${done?' done':''}" data-act="day" data-d="${d}" aria-label="${DN[i]} ${fdate(d)}: ${tname(t)}${done?', hecho':''}"><span class="dn">${DS[i]} ${parse(d).getDate()}</span><span class="dt">${t==='X'?'Libre':t==='R'?'Remo':t}</span><span class="st">${done?'Hecho':t==='X'?'·':d<TODAY?'Sin registro':'Pendiente'}</span></button>`;}
  return h+'</div>';}

function exCard(r,i,d,w){const slot=rut()[r].s[i],bk=blockOf(w),id=chosen(r,i,bk),ex=EX[id],rx=presc(w,slot[1],ex),key=(d?'s':'r')+r+i,isOpen=open.has(key);

  ${ex.w?'<p class="small muted">Elige un peso con el que llegues al rango indicado sin perder la técnica. Cuando completes el máximo de repeticiones en todas las series, sube el peso.</p>':slot[1]==='core'?'':'<p class="small muted">Cuando superes el rango, hazlo más difícil: baja en 3 segundos, agrega una pausa, usa '+harder()+'.</p>'}
  ${avail(slot[2]).length>1?`<div><button type="button" class="btn sm" data-act="swap" data-r="${r}" data-i="${i}" data-b="${bk}">Cambiar variante</button></div>`:''}</div>`;
  if(d){const last=lastOf(id,d),tg=target(id,ex,slot[1],rx,w,d);
    h+='<div class="sets"><p class="small note"><b>Objetivo de hoy:</b> '+esc(tg.t)+'</p>';
    if(last)h+=`<p class="small muted">Última vez (${fdate(last.d)}): ${last.s.filter(x=>x&&x.ok).map(x=>(ex.w&&x.kg?num(x.kg)+' kg × ':'')+(x.r||'?')).join(' · ')}${ex.u?' s':ex.w?'':' reps'}</p>`;
    for(let j=0;j<rx.sets;j++){const s=sets[j]||{},ls=last&&last.s[j]||{};
      h+=`<div class="set${ex.w?'':' nokg'}"><span>Serie ${j+1}</span>${ex.w?`<label class="in"><input type="number" inputmode="decimal" min="0" step="0.5" id="kg-${id}-${j}" aria-label="Kilos serie ${j+1}" data-f="kg" data-ex="${id}" data-j="${j}" value="${esc(s.kg)}" placeholder="${esc(tg.kg||ls.kg||'')}"><i>kg</i></label>`:''}<label class="in"><input type="number" inputmode="numeric" min="0" id="r-${id}-${j}" aria-label="${ex.u?'Segundos':'Repeticiones'} serie ${j+1}" data-f="r" data-ex="${id}" data-j="${j}" value="${esc(s.r)}" placeholder="${esc(rx.reps)}"><i>${u}</i></label><button type="button" class="chk" data-act="done" data-ex="${id}" data-j="${j}" data-rest="${rx.rest}" data-n="${rx.sets}" aria-pressed="${!!s.ok}">${s.ok?'Hecha':'Marcar'}</button></div>`;}
    h+='</div>';}
  return h+'</div></article>';}

function rowWeek(d){const m=monday(d);let n=0,k=0,any=false;for(let i=0;i<7;i++){const e=state.log[addDays(m,i)];if(e&&e.type==='R'&&e.done){n++;if(e.row&&+e.row.k>0){k+=+e.row.k;any=true;}}}

function modeBox(){const sp=split();return `<section class="card"><h3>Modalidad de fuerza e hipertrofia</h3><div class="form"><label>Cómo se reparten los 3 días<select id="mode" data-f="mode"><option value="full"${sp?'':' selected'}>Cuerpo completo</option><option value="split"${sp?' selected':''}>Por grupo muscular</option></select></label></div><p class="small muted">${sp?'Cada día se concentra en un grupo: A pecho, hombros y tríceps; B espalda, bíceps y abdomen; C piernas, glúteos y abdomen. Son más ejercicios y series por grupo, con más carga y pausas más largas en los principales (4 series de 6 a 12 repeticiones). Cada grupo se entrena una vez por semana, así que no faltes a ninguna de las tres sesiones.':'Las rutinas A, B y C trabajan todo el cuerpo, de modo que cada músculo recibe estímulo tres veces por semana. Es la opción más segura si a veces te saltas un día.'} Tus registros se conservan al cambiar de modalidad.</p></section>`;}
function equipBox(){const e=state.equip;return `<section class="card"><h3>Equipamiento disponible</h3><p class="small muted">La base usa peso corporal, bandas elásticas y rueda abdominal. Si no tienes bandas, desactívalas: esos ejercicios se reemplazan por variantes con mochila cargada, botellas de agua o solo peso corporal. Al activar mancuernas o banco, las rutinas cambian a las variantes con ese equipo.</p><div class="rowf"><label class="tog"><input type="checkbox" id="eq-band" data-f="eq-band" ${e.band!==false?'checked':''}>Bandas elásticas</label><label class="tog"><input type="checkbox" id="eq-db" data-f="eq-db" ${e.db?'checked':''}>Mancuernas</label><label class="tog"><input type="checkbox" id="eq-bench" data-f="eq-bench" ${e.bench?'checked':''} ${e.db?'':'disabled'}>Banco de ejercicios</label></div>${e.db?'':'<p class="small muted">El banco se usa junto con las mancuernas. Para comprar: un par ajustable que llegue a unos 20 kg por mano cubre todo el programa.</p>'}</section>`;}

function viewPlan(){const w=weekOf(TODAY),s=state.sched,nF=s.filter(x=>'ABC'.includes(x)).length,nR=s.filter(x=>x==='R').length,nX=s.filter(x=>x==='X').length;
  const consec=s.some((x,i)=>'ABC'.includes(x)&&'ABC'.includes(s[(i+1)%7])),miss=['A','B','C'].filter(x=>!s.includes(x));
  let h=`<section class="card"><h2>Tu semana</h2><div class="sched">${DN.map((n,i)=>`<label>${n}<select id="sch-${i}" data-f="sched" data-i="${i}">${Object.keys(TYPES).map(k=>`<option value="${k}"${s[i]===k?' selected':''}>${tname(k)}</option>`).join('')}</select></label>`).join('')}</div>
  <p class="small">${nF} días de fuerza · ${nR} de solo remo · ${nX} de descanso</p>
  ${consec&&!split()?'<p class="small warnbox">Tienes dos días de fuerza seguidos. Como cada rutina trabaja todo el cuerpo, deja al menos un día entre ellas.</p>':''}${nF<3?'<p class="small warnbox">El plan está pensado para un mínimo de 3 días de fuerza a la semana.</p>':''}${miss.length&&nF>=3?`<p class="small warnbox">Falta asignar la rutina ${miss.join(' y ')}.</p>`:''}</section>`+modeBox()+equipBox();
  const bk=blockOf(w),wb=wbOf(w);
  h+=`<section class="card"><div class="rowf sp"><h2>Ciclo ${bk} · semana ${wb} de ${BW}</h2><div class="rowf"><button type="button" class="btn sm" data-act="wk" data-n="-1" aria-label="Retroceder una semana">−</button><span>Semana</span><button type="button" class="btn sm" data-act="wk" data-n="1" aria-label="Avanzar una semana">+</button><button type="button" class="btn sm" data-act="wk0">Volver al ciclo 1</button></div></div>
  <p class="small">El plan no termina: se repite en ciclos de ${BW} semanas y cada ciclo parte desde las cargas que alcanzaste en el anterior.</p>
  <div class="tw"><table><thead><tr><th>Semana del ciclo</th><th>Fase</th><th>Principales</th><th>Accesorios</th><th>Pausa</th></tr></thead><tbody>`;
  for(let k=1;k<=BW;k++){const kk=(bk-1)*BW+k,m=presc(kk,'main'),a=presc(kk,'acc');h+=`<tr class="${k===wb?'cur':''}"><td>${k}</td><td>${FASES[phaseOf(k)].n}</td><td>${m.sets} × ${m.reps}</td><td>${a.sets} × ${a.reps}</td><td>${m.rest} / ${a.rest} s</td></tr>`;}
  h+=`</tbody></table></div><p class="small muted">${split()?'Principales: los primeros ejercicios de pecho, hombros, espalda y piernas. Accesorios: el resto.':'Principales: piernas, pecho y espalda. Accesorios: glúteos, hombros, bíceps y tríceps.'} Pantorrillas y abdomen tienen su propio rango. Los días de remo se mantienen iguales: 1.000 remadas.</p></section>
  <section class="card"><h3>Cómo sube la carga</h3><ol class="obs"><li><b>Primero repeticiones, después peso.</b> Cada ejercicio tiene un rango (por ejemplo 8-12). Mantén el peso hasta lograr el máximo del rango en todas las series; entonces sube 1 a 2 kg y vuelve al mínimo.</li><li><b>La página lo calcula por ti.</b> Al abrir un ejercicio en la sesión verás el objetivo de hoy según lo que registraste la última vez, y el peso sugerido aparece en gris en la casilla de kilos.</li><li><b>Sin mancuernas</b> la progresión es la misma, pero en vez de kilos cambias la dificultad: bajada en 3 segundos, pausa, banda más dura o mochila con peso.</li><li><b>Descarga cada ${BW} semanas.</b> Una semana liviana permite recuperar articulaciones y partir el ciclo siguiente con más fuerza.</li></ol></section>

  if(STANDALONE)h+=`<section class="card"><h3>Respaldo de tus registros</h3><p class="small muted">Tus series, mediciones y ajustes se guardan solo en este dispositivo. Descarga un respaldo cada cierto tiempo, o para pasar tus datos a otro teléfono.</p><div class="rowf"><button type="button" class="btn" data-act="bk-out">Descargar respaldo</button><label class="btn" style="display:inline-flex;align-items:center">Restaurar respaldo<input type="file" id="bk-in" accept="application/json,.json" data-f="bk-in" style="position:absolute;width:1px;height:1px;opacity:0"></label></div><p class="small" id="bk-msg" role="status"></p></section>`;
  return h;}

function viewRut(){const w=weekOf(TODAY);let h=`<div class="rowf">${['A','B','C'].map(k=>`<button type="button" class="btn${rtab===k?' pri':''}" data-act="rt" data-r="${k}" aria-pressed="${rtab===k}">Rutina ${k}</button>`).join('')}</div><p><b>${rut()[rtab].foco}.</b> <span class="muted">Toca un ejercicio para ver la animación y las claves técnicas.</span></p>`;

const METRICS=[['w','Peso','kg'],['fat','Grasa corporal','%'],['mus','Masa muscular','kg'],['visc','Grasa visceral',''],['whr','Cintura-cadera',''],['waist','Cintura','cm'],['bmr','Metabolismo basal','kcal']];
const DASH=['','7 4','2 4','9 3 2 3','','7 4','2 4'];const hid=new Set();
// Un solo gráfico para todos los criterios: cada línea es el cambio porcentual desde la primera medición de ese criterio
function multiChart(rows){
  const ser=METRICS.map((m,i)=>({m,i,p:rows.filter(r=>r[m[0]]!=null&&r[m[0]]!==''&&+r[m[0]]>0).map(r=>({d:r.d,v:+r[m[0]]}))})).filter(x=>x.p.length);
  if(!ser.length)return '<section class="card"><h3>Evolución</h3><p class="muted">Agrega tu primera medición para empezar a ver tu progreso.</p></section>';
  ser.forEach(x=>{x.q=x.p.map(p=>({d:p.d,v:(p.v/x.p[0].v-1)*100}));});
  const leg=ser.map(x=>{const l=x.p[x.p.length-1],ch=n1(x.q[x.q.length-1].v),off=hid.has(x.m[0]);
    return `<button type="button" class="lg${off?' off':''}" data-act="mt" data-k="${x.m[0]}" aria-pressed="${!off}"><svg width="26" height="10" aria-hidden="true"><line x1="1" y1="5" x2="25" y2="5" stroke="var(--m${x.i+1})" stroke-width="3" stroke-dasharray="${DASH[x.i]}"/></svg><span>${x.m[1]}</span><b>${num(l.v)}${x.m[2]?' '+x.m[2]:''}</b>${x.p.length>1?`<i>${ch>0?'+':''}${num(ch)} %</i>`:''}</button>`;}).join('');
  const vis=ser.filter(x=>!hid.has(x.m[0])&&x.q.length>1);let svg='';
  if(!vis.length)svg='<p class="small muted">'+(ser.some(x=>x.q.length>1)?'Activa al menos un criterio para ver su línea.':'Con la segunda medición aparecerán las líneas de cada criterio.')+'</p>';
  else{const W=640,H=270,L=46,R=14,T=14,B=26,all=vis.flatMap(x=>x.q);let mn=Math.min(0,...all.map(p=>p.v)),mx=Math.max(0,...all.map(p=>p.v));if(mx-mn<2){mn-=1;mx+=1;}const pad=(mx-mn)*.08;mn-=pad;mx+=pad;
    const ts=all.map(p=>parse(p.d).getTime()),t0=Math.min(...ts),t1=Math.max(...ts),X=d=>L+(parse(d).getTime()-t0)/(t1-t0||1)*(W-L-R),Y=v=>T+(mx-v)/(mx-mn)*(H-T-B);
    const step=[1,2,5,10,20,50].find(k=>(mx-mn)/k<=6)||100;let grid='';
    for(let g=Math.ceil(mn/step)*step;g<=mx;g+=step)grid+=`<line x1="${L}" y1="${n1(Y(g))}" x2="${W-R}" y2="${n1(Y(g))}" stroke="var(--line)" stroke-width="${g===0?1.6:1}"/><text x="${L-6}" y="${n1(Y(g)+3.5)}" text-anchor="end">${g>0?'+':''}${g} %</text>`;
    const d0=iso(new Date(t0)),d1=iso(new Date(t1));
    svg=`<div class="tw"><svg class="chart big" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cambio porcentual de cada criterio desde su primera medición. ${vis.map(x=>x.m[1]+': '+num(n1(x.q[x.q.length-1].v))+' %').join('; ')}">${grid}<text x="${L}" y="${H-6}">${fdate(d0)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${fdate(d1)}</text>`+
      vis.map(x=>`<polyline points="${x.q.map(p=>n1(X(p.d))+','+n1(Y(p.v))).join(' ')}" fill="none" stroke="var(--m${x.i+1})" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="${DASH[x.i]}"/>`+x.q.map((p,k)=>`<circle cx="${n1(X(p.d))}" cy="${n1(Y(p.v))}" r="${k===x.q.length-1?4.5:2.6}" fill="var(--m${x.i+1})"><title>${x.m[1]} · ${fdate(p.d)}: ${num(x.p[k].v)}${x.m[2]?' '+x.m[2]:''}</title></circle>`).join('')).join('')+'</svg></div>';}
  return `<section class="card"><h3>Evolución de cada criterio</h3><p class="small muted">Cada línea muestra cuánto cambió ese criterio, en porcentaje, desde tu primera medición. Así se pueden comparar en un mismo gráfico aunque tengan unidades distintas. Toca un criterio para ocultarlo o mostrarlo.</p>${svg}<div class="legend">${leg}</div></section>`;}

// Rangos de referencia para adultos. Fuentes: OMS (IMC, cintura, cintura-cadera), Gallagher et al. 2000 (grasa corporal por sexo y edad), escalas de fabricantes de balanzas (grasa visceral).
function refs(pf){const s=pf.sex,a=+pf.age||0,g=a>=60?2:a>=40?1:0,o=[];
  o.push({k:'bmi',n:'IMC',b:[18.5,25,30],t:['18,5 a 24,9','25 a 29,9','30 o más'],e:'Relaciona el peso con la estatura. Es la referencia general de la OMS, pero no distingue músculo de grasa: una persona musculosa puede marcar alto sin tener exceso de grasa. Bajo 18,5 se considera bajo peso.',need:pf.h?'':'Anota tu estatura para calcularlo.'});
  if(s&&a){const F=(s==='h'?[[8,20,25],[11,22,28],[13,25,30]]:[[21,33,39],[23,34,40],[24,36,42]])[g];
    o.push({k:'fat',n:'Grasa corporal',u:' %',b:F,t:[`${F[0]} a ${num(F[1]-.1)} %`,`${F[1]} a ${num(F[2]-.1)} %`,`${F[2]} % o más`],e:`Proporción del peso que es grasa. El rango depende del sexo y la edad; este corresponde a ${s==='h'?'hombres':'mujeres'} de ${['20 a 39','40 a 59','60 a 79'][g]} años. Bajo ${F[0]} % también es un riesgo: el cuerpo necesita una reserva mínima de grasa.`});}
  else o.push({k:'fat',n:'Grasa corporal',u:' %',e:'Proporción del peso que es grasa. El rango saludable depende del sexo y la edad.',need:'Completa tu sexo y edad en "Tus datos" para ver tu rango.'});
  if(s){const W=s==='h'?[null,94,102]:[null,80,88],R=s==='h'?[null,.9,1]:[null,.8,.85];
    o.push({k:'waist',n:'Cintura',u:' cm',b:W,t:[`Menos de ${W[1]} cm`,`${W[1]} a ${num(W[2]-.1)} cm`,`${W[2]} cm o más`],e:'Indica cuánta grasa se acumula en el abdomen, que es la más asociada a diabetes y enfermedades del corazón. Se mide con huincha a la altura del ombligo, sin apretar.'});
    o.push({k:'whr',n:'Relación cintura-cadera',u:'',b:R,t:[`Menos de ${num(R[1])}`,`${num(R[1])} a ${num(n1(R[2]*100-1)/100)}`,`${num(R[2])} o más`],e:'Cintura dividida por cadera. Mientras más alta, más grasa se concentra en el abdomen en comparación con las caderas, lo que aumenta el riesgo cardiovascular.'});}
  else o.push({k:'waist',n:'Cintura y relación cintura-cadera',u:'',e:'Indican cuánta grasa se acumula en el abdomen. Los límites son distintos para hombres y mujeres.',need:'Completa tu sexo en "Tus datos" para ver tus rangos.'});
  o.push({k:'visc',n:'Grasa visceral',u:'',b:[null,10,15],t:['1 a 9','10 a 14','15 o más'],e:'Nivel estimado de la grasa que rodea los órganos del abdomen. La escala depende de la marca de la balanza: la de arriba es la más usada (niveles 1 a 30); algunas marcas, como Tanita, usan otra escala y consideran saludable de 1 a 12. Revisa el manual de la tuya.'});
  o.push({k:'mus',n:'Masa muscular y peso sin grasa',u:' kg',e:'No tienen rangos de riesgo universales: dependen de la estatura, el sexo y la contextura. Lo que importa es tu propia tendencia: mantenerlos o subirlos mientras baja la grasa.'});
  o.push({k:'bmr',n:'Metabolismo basal',u:' kcal',e:'Calorías que tu cuerpo gasta en reposo en un día. No hay un valor ideal: sube con la masa muscular y sirve de piso para planificar la alimentación. Comer por debajo de él de forma sostenida dificulta la recuperación.'});
  return o;}
function refCard(rows,pf){const last=k=>{for(let i=rows.length-1;i>=0;i--)if(rows[i][k]!=null&&rows[i][k]!=='')return +rows[i][k];return null;};
  return `<section class="card"><h3>Rangos de referencia</h3><p class="small muted">Valores para adultos. Saludable: sin riesgo adicional. Riesgo: conviene bajarlo. Alto: riesgo claramente mayor; vale la pena consultarlo con un médico.</p><div class="refs">${refs(pf).map(r=>{const v=last(r.k);let st='';
    if(r.b&&v!=null){const c=r.b[0]!=null&&v<r.b[0]?['warn','Bajo']:v<r.b[1]?['ok','Saludable']:v<r.b[2]?['warn','Riesgo']:['bad','Alto'];st=`<span class="pill ${c[0]}">${c[1]}</span>`;}
    return `<div class="ref"><div class="rowf sp"><b>${r.n}</b><span class="rowf">${v!=null?`<span class="small">Tu último valor: <b>${num(v)}${r.u||""}</b></span>`:''}${st}</span></div>${r.t?`<div class="bands"><span class="bd ok"><i>Saludable</i>${r.t[0]}</span><span class="bd warn"><i>Riesgo</i>${r.t[1]}</span><span class="bd bad"><i>Alto</i>${r.t[2]}</span></div>`:''}${r.need?`<p class="small warnbox">${r.need}</p>`:''}<p class="small muted">${r.e}</p></div>`;}).join('')}</div><p class="small muted">Fuentes: Organización Mundial de la Salud (IMC, cintura y cintura-cadera), Gallagher y colaboradores, 2000 (grasa corporal) y escalas de fabricantes de balanzas (grasa visceral). Son referencias generales, no un diagnóstico.</p></section>`;}
function viewBody(){const pf=state.prof||{},hm=+pf.h>0?+pf.h/100:0;
  const rows=state.body.slice().sort((a,b)=>a.d<b.d?-1:1).map(r=>{const x=Object.assign({},r);if(hm&&r.w)x.bmi=n1(r.w/(hm*hm));if(r.w&&r.fat){x.fkg=n1(r.w*r.fat/100);x.lean=n1(r.w-r.w*r.fat/100);}if(r.w&&r.mus)x.mp=n1(r.mus/r.w*100);return x;}),f=rows[0],l=rows[rows.length-1];
  const tile=(k,lab,unit,goodDown)=>{if(!l||l[k]==null||l[k]==='')return `<div class="tile"><div class="l">${lab}</div><div class="v">–</div></div>`;
    const dv=f&&f!==l&&f[k]!=null&&f[k]!==''?n1(l[k]-f[k]):null;
    return `<div class="tile"><div class="l">${lab}</div><div class="v">${num(l[k])}<span style="font-size:18px"> ${unit}</span></div>${dv===null?'<div class="d muted">Medición inicial</div>':`<div class="d ${dv===0?'muted':(dv<0)===goodDown?'up':'down'}">${dv>0?'+':''}${num(dv)} ${unit} desde ${fdate(f.d)}</div>`}</div>`;};
  let h=`<h2>Mediciones corporales</h2><section class="card"><h3>Tus datos</h3><div class="form"><label>Estatura (cm)<input class="fi" type="number" inputmode="decimal" min="0" step="0.5" id="pf-h" data-f="prof" data-k="h" value="${esc(pf.h)}"></label><label>Edad (años)<input class="fi" type="number" inputmode="numeric" min="0" id="pf-age" data-f="prof" data-k="age" value="${esc(pf.age)}"></label><label>Sexo<select id="pf-sex" data-f="prof" data-k="sex"><option value=""></option><option value="h"${pf.sex==='h'?' selected':''}>Hombre</option><option value="m"${pf.sex==='m'?' selected':''}>Mujer</option></select></label></div><p class="small muted">Con la estatura se calcula el IMC. El peso sin grasa, los kilos de grasa y el porcentaje de músculo se calculan solos a partir de cada medición.</p></section>
  <div class="tiles">${tile('w','Peso','kg',true)}${tile('bmi','IMC','',true)}${tile('fat','Grasa corporal','%',true)}${tile('fkg','Grasa en kilos','kg',true)}${tile('mus','Masa muscular','kg',false)}${tile('mp','Porcentaje de músculo','%',false)}${tile('lean','Peso sin grasa','kg',false)}${tile('visc','Grasa visceral','',true)}${tile('whr','Relación cintura-cadera','',true)}${tile('bmr','Metabolismo basal','kcal',false)}</div>`;
  h+=multiChart(rows)+refCard(rows,pf);
  h+=`<section class="card"><h3>Agregar medición</h3><form id="bform" class="form"><label>Fecha<input class="fi" type="date" id="b-d" value="${TODAY}" required></label><label>Peso (kg)<input class="fi" type="number" step="0.1" id="b-w" required></label><label>Grasa (%)<input class="fi" type="number" step="0.1" id="b-fat"></label><label>Músculo (kg)<input class="fi" type="number" step="0.1" id="b-mus"></label><label>Grasa visceral<input class="fi" type="number" step="0.5" id="b-visc"></label><label>Cintura-cadera<input class="fi" type="number" step="0.01" id="b-whr" placeholder="0,95"></label><label>Cintura (cm)<input class="fi" type="number" step="0.5" id="b-waist"></label><label>Metab. basal (kcal)<input class="fi" type="number" step="1" id="b-bmr"></label><button class="btn pri" type="submit">Guardar medición</button></form>
  <p class="small muted">Mídete cada 2 semanas, el mismo día, al despertar, en ayunas y después de ir al baño. La balanza de bioimpedancia varía con la hidratación: importa la tendencia, no una medición aislada.</p></section>`;
  if(rows.length)h+=`<section class="card"><h3>Historial</h3><div class="tw"><table><thead><tr><th>Fecha</th><th>Peso</th><th>IMC</th><th>Grasa</th><th>Kg de grasa</th><th>Sin grasa</th><th>Músculo</th><th>Visceral</th><th>Cintura-cadera</th><th>Cintura</th><th>Basal</th><th></th></tr></thead><tbody>${rows.slice().reverse().map(r=>`<tr><td>${fdate(r.d)} ${parse(r.d).getFullYear()}</td><td>${num(r.w)} kg</td><td>${r.bmi?num(r.bmi):'–'}</td><td>${r.fat?num(r.fat)+' %':'–'}</td><td>${r.fkg?num(r.fkg)+' kg':'–'}</td><td>${r.lean?num(r.lean)+' kg':'–'}</td><td>${r.mus?num(r.mus)+' kg':'–'}</td><td>${r.visc?num(r.visc):'–'}</td><td>${r.whr?num(r.whr):'–'}</td><td>${r.waist?num(r.waist)+' cm':'–'}</td><td>${r.bmr?num(r.bmr)+' kcal':'–'}</td><td><button type="button" class="btn sm" data-act="bdel" data-d="${r.d}" aria-label="Eliminar medición del ${fdate(r.d)}">Eliminar</button></td></tr>`).join('')}</tbody></table></div></section>`;
  h+=`<section class="card"><h3>Qué esperar en los primeros 3 meses</h3><ol class="obs"><li><b>Recomposición, no solo balanza.</b> Al ganar músculo y perder grasa a la vez, el peso puede moverse poco. Mira el porcentaje de grasa, la masa muscular y la cintura.</li><li><b>Grasa corporal:</b> bajar entre 2 y 3 puntos porcentuales en este período es una meta razonable.</li><li><b>Masa muscular:</b> mantenerla mientras bajas grasa ya es un buen resultado; al retomar la fuerza es habitual subir algo.</li><li><b>Grasa visceral y cintura:</b> son los indicadores de salud que más conviene bajar; en hombres, la OMS usa 0,90 como referencia para la relación cintura-cadera.</li></ol><p class="small muted">Metas orientativas. Mide tu cintura con huincha a la altura del ombligo cada 2 semanas.</p></section>`;
  return h;}

function viewFood(){const f=state.food||{},inp=(k,l,u,ph)=>`<label>${l}<span class="in"><input type="number" inputmode="decimal" min="0" step="any" id="food-${k}" data-f="food" data-k="${k}" value="${esc(f[k])}" placeholder="${ph}"><i>${u}</i></span></label>`;
return `<h2>Alimentación</h2>
<section class="card"><h3>Tus metas diarias</h3><p class="small muted">Anota aquí las metas del plan que te entregó tu nutricionista para tenerlas a mano. Se guardan solo en este dispositivo.</p><div class="form">${inp('kcal','Calorías','kcal','')}${inp('prot','Proteínas','g','')}${inp('carb','Carbohidratos','g','')}${inp('fat','Lípidos','g','')}${inp('water','Agua','L','')}</div>${f.prot&&state.body.length?(()=>{const w=state.body.slice().sort((a,b)=>a.d<b.d?-1:1).pop().w;return w?`<p class="small note">Tu proteína equivale a ${num(n1(f.prot/w))} g por kilo de peso. Para ganar músculo se suele trabajar entre 1,6 y 2,2 g por kilo.</p>`:'';})():''}</section>
<section class="card"><h3>Claves para acompañar el entrenamiento</h3><ol class="obs">
<li><b>Sigue el plan de tu nutricionista.</b> Esta app no reemplaza sus indicaciones.</li>
<li><b>Proteína en cada comida.</b> Repartirla durante el día ayuda a ganar y conservar músculo.</li>
<li><b>Déficit moderado.</b> Para bajar grasa y ganar músculo a la vez conviene comer algo menos de lo que gastas, no mucho menos: un déficit muy grande dificulta la recuperación y la ganancia de masa muscular.</li>
<li><b>Avisa de los cambios de entrenamiento.</b> Si tu plan se calculó antes de sumar los días de fuerza, pide actualizarlo.</li>
<li><b>Días de fuerza:</b> deja una comida con proteína y cereal en las 2 horas previas o posteriores a la sesión.</li>
<li><b>Señales de que falta energía:</b> bajas más de 1 kg por semana, pierdes masa muscular en la balanza, o las cargas se estancan 2 semanas seguidas con cansancio. Si ocurre, adelanta la consulta.</li>
<li><b>Sueño e hidratación:</b> 7 a 8 horas de sueño y el agua indicada en tu plan influyen en la recuperación tanto como la rutina.</li></ol>
<p class="small muted">Recomendaciones generales y orientativas.</p></section>`;}

/* ===== Render y animación ===== */
const VIEWS={hoy:viewHoy,plan:viewPlan,rutinas:viewRut,cuerpo:viewBody,alimentacion:viewFood};
function view(){const v=location.hash.slice(1);return VIEWS[v]?v:'hoy';}
function render(){const v=view(),w=weekOf(TODAY),p=phaseOf(w);
  $('#main').innerHTML=VIEWS[v]();
  document.querySelectorAll('nav.tabs a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+v));
  $('#wk').innerHTML=w<1?'El plan parte el '+fdate(state.start):`Ciclo <b>${blockOf(w)}</b> · semana ${wbOf(w)} de ${BW} · ${FASES[p].n}`;
  paint(performance.now(),true);}
const RM=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function paint(now,force){const els=document.querySelectorAll('svg.anim');if(!els.length)return;
  const ph=(now%3000)/3000,tri=ph<.42?ph/.42:ph<.5?1:ph<.92?1-(ph-.5)/.42:0,u=tri*tri*(3-2*tri);
  els.forEach(el=>{const ex=EX[el.dataset.a];if(!ex)return;
    if(RM){if(force)el.innerHTML='<g opacity=".3">'+figure(ex.a[0],ex.a[1],0)+'</g>'+figure(ex.a[0],ex.a[1],1);}
    else el.innerHTML=figure(ex.a[0],ex.a[1],u);});}
function loop(now){if(!RM)paint(now,false);requestAnimationFrame(loop);}

/* ===== Temporizador de descanso ===== */
let tEnd=0,tTot=0,tInt=null,actx=null;
function beep(){try{if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.2,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.6);o.start();o.stop(actx.currentTime+.6);}catch(e){}}
function tick(){const left=Math.max(0,Math.ceil((tEnd-Date.now())/1000));$('#ttm').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
  $('#tbar').style.width=(tTot?Math.min(100,100-(tEnd-Date.now())/tTot*100):0)+'%';
  if(left<=0){clearInterval(tInt);tInt=null;$('#timer').classList.add('end');$('#tlb').textContent='Descanso terminado. Siguiente serie.';beep();setTimeout(()=>{if(!tInt)$('#timer').classList.remove('on','end');},6000);}}
function startTimer(sec){try{if(!actx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)actx=new AC();}if(actx&&actx.state==='suspended')actx.resume();}catch(e){}
  tTot=sec*1000;tEnd=Date.now()+tTot;$('#timer').classList.remove('end');$('#timer').classList.add('on');$('#tlb').textContent='Descanso entre series';clearInterval(tInt);tInt=setInterval(tick,250);tick();}
function stopTimer(){clearInterval(tInt);tInt=null;$('#timer').classList.remove('on','end');}

/* ===== Eventos ===== */
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='tog'){open.has(b.dataset.k)?open.delete(b.dataset.k):open.add(b.dataset.k);render();}
  else if(a==='day'){sel=b.dataset.d;if(view()!=='hoy')location.hash='hoy';render();}
  else if(a==='rt'){rtab=b.dataset.r;render();}
  else if(a==='swap'){const r=b.dataset.r,i=+b.dataset.i,bk=+b.dataset.b,o=avail(rut()[r].s[i][2]),c=chosen(r,i,bk);state.pick[pk(r,i)]={b:bk,id:o[(o.indexOf(c)+1)%o.length]};persist();render();}
  else if(a==='done'){const e=entry(sel,true),id=b.dataset.ex,j=+b.dataset.j,arr=e.ex[id]||(e.ex[id]=[]);while(arr.length<=j)arr.push({});
    arr[j].ok=!arr[j].ok;if(arr[j].ok){const ri=$('#r-'+id+'-'+j);if(ri&&!ri.value&&ri.placeholder&&/^\d+$/.test(ri.placeholder))arr[j].r=ri.placeholder;const ki=$('#kg-'+id+'-'+j);if(ki&&!ki.value&&ki.placeholder)arr[j].kg=ki.placeholder;startTimer(+b.dataset.rest);}
    const t=e.type,w=weekOf(sel);if(rut()[t]){e.done=rut()[t].s.every((s,i)=>{const x=chosen(t,i,blockOf(w)),n=presc(w,s[1],EX[x]).sets,ss=e.ex[x]||[];return ss.slice(0,n).filter(q=>q&&q.ok).length>=n;});}
    persist();render();}
  else if(a==='finish'){const e=entry(sel,true);e.done=!e.done;if(e.type==='R'&&!e.row)e.row={s:1000};persist();render();}
  else if(a==='wk'){state.start=addDays(state.start,-7*(+b.dataset.n));persist();render();}
  else if(a==='wk0'){state.start=monday(TODAY);persist();render();}
  else if(a==='mt'){hid.has(b.dataset.k)?hid.delete(b.dataset.k):hid.add(b.dataset.k);render();}
  else if(a==='bdel'){state.body=state.body.filter(r=>r.d!==b.dataset.d);persist();render();}
  else if(a==='t-add'){if(tInt){tEnd+=15000;tTot+=15000;tick();}}
  else if(a==='t-stop')stopTimer();
  else if(a==='bk-out'){try{const u=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='plan-fuerza-remo-respaldo-'+TODAY+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);}catch(e){$('#bk-msg').textContent='No se pudo generar el respaldo.';}}
});
document.addEventListener('input',ev=>{const el=ev.target,f=el.dataset&&el.dataset.f;if(!f)return;
  if(f==='kg'||f==='r'){const e=entry(sel,true),id=el.dataset.ex,j=+el.dataset.j,arr=e.ex[id]||(e.ex[id]=[]);while(arr.length<=j)arr.push({});arr[j][f]=el.value;persist();}
  else if(f==='food'){state.food=state.food||{};state.food[el.dataset.k]=el.value;persist();}
  else if(f==='row-s'||f==='row-m'||f==='row-k'){const e=entry(sel,true);e.row=e.row||{s:1000};e.row[f.slice(4)]=el.value;persist();}
  else if(f==='prof'){state.prof=state.prof||{};state.prof[el.dataset.k]=el.value;persist();}
});
document.addEventListener('change',ev=>{const el=ev.target,f=el.dataset&&el.dataset.f;if(!f)return;
  if(f==='prof'){render();}
  else if(f==='sched'){state.sched[+el.dataset.i]=el.value;persist();render();}
  else if(f==='eq-db'){state.equip.db=el.checked;if(!el.checked)state.equip.bench=false;persist();render();}
  else if(f==='mode'){state.mode=el.value==='split'?'split':'full';persist();render();}
  else if(f==='eq-band'){state.equip.band=el.checked;persist();render();}
  else if(f==='eq-bench'){state.equip.bench=el.checked;persist();render();}
  else if(f==='bk-in'){const file=el.files&&el.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{try{const r=JSON.parse(rd.result);if(!r||r.v!==1||!Array.isArray(r.sched))throw 0;state=merge(r);persist();render();$('#bk-msg').textContent='Respaldo restaurado.';}catch(e){$('#bk-msg').textContent='Ese archivo no es un respaldo válido de este plan.';}};rd.readAsText(file);}
});
document.addEventListener('submit',ev=>{if(ev.target.id!=='bform')return;ev.preventDefault();const g=id=>$('#'+id).value,d=g('b-d'),w=g('b-w');if(!d||!w)return;
  const row={d,w:+w};[['fat','b-fat'],['mus','b-mus'],['visc','b-visc'],['whr','b-whr'],['waist','b-waist'],['bmr','b-bmr']].forEach(([k,id])=>{if(g(id)!=='')row[k]=+g(id);});
  state.body=state.body.filter(r=>r.d!==d);state.body.push(row);persist();render();});
window.addEventListener('hashchange',render);
render();requestAnimationFrame(loop);initDb();

if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(()=>{document.documentElement.dataset.sw='ok';}).catch(()=>{});});}
</script>
</body>
</html>
